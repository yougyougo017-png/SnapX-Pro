<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#080618"/>
      <stop offset=".42" stop-color="#1A0E35"/>
      <stop offset=".7" stop-color="#5B1451"/>
      <stop offset=".86" stop-color="#B22A5C"/>
      <stop offset="1" stop-color="#F06B4A"/>
    </linearGradient>
    <radialGradient id="sun" cx="0" cy="0" r="1" gradientTransform="translate(800 560) scale(410 260)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD700"/>
      <stop offset=".32" stop-color="#FF9D3D"/>
      <stop offset=".65" stop-color="#FF3D7F" stop-opacity=".65"/>
      <stop offset="1" stop-color="#FF3D7F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="800" y1="560" x2="800" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A1830"/>
      <stop offset=".4" stop-color="#0D0C1A"/>
      <stop offset="1" stop-color="#06060C"/>
    </linearGradient>
    <linearGradient id="cityLeft" x1="0" y1="300" x2="0" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A1030"/>
      <stop offset="1" stop-color="#070711"/>
    </linearGradient>
    <linearGradient id="cityRight" x1="0" y1="300" x2="0" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A1030"/>
      <stop offset="1" stop-color="#070711"/>
    </linearGradient>
    <linearGradient id="car" x1="800" y1="690" x2="800" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2A2E46"/>
      <stop offset=".5" stop-color="#12131F"/>
      <stop offset="1" stop-color="#05060B"/>
    </linearGradient>
    <linearGradient id="carGlass" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#304D7A"/>
      <stop offset="1" stop-color="#0A1020"/>
    </linearGradient>
    <linearGradient id="neonGold" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FFD700"/>
      <stop offset="1" stop-color="#FF8A00"/>
    </linearGradient>
    <linearGradient id="neonBlue" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00C2FF"/>
      <stop offset="1" stop-color="#3D5BFF"/>
    </linearGradient>
    <linearGradient id="hudPanel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0B1220" stop-opacity=".82"/>
      <stop offset="1" stop-color="#060912" stop-opacity=".6"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="grain">
      <feTurbulence baseFrequency=".8" numOctaves="2" stitchTiles="stitch" type="fractalNoise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".06"/></feComponentTransfer>
    </filter>
  </defs>
