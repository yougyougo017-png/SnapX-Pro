      <rect x="72" y="648" width="272" height="70" rx="14" fill="#0B111C" stroke="#FFFFFF" stroke-opacity=".06"/>
      <path d="M94 684h12v-12h-12v12ZM118 672h-8v12h8M92 696h14" stroke="#6F7A8F" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <text x="142" y="678" fill="#C9D0DE" font-size="10" font-weight="600">256-bit encryption</text>
      <text x="142" y="694" fill="#5D677A" font-size="8.5">Bank-level security</text>
    </g>
    <g>
      <rect x="360" y="648" width="302" height="70" rx="14" fill="#0B111C" stroke="#FFFFFF" stroke-opacity=".06"/>
      <circle cx="388" cy="683" r="12" fill="#3BE3A0" fill-opacity=".1"/>
      <path d="m382 683 4 4 8-9" stroke="#3BE3A0" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="410" y="678" fill="#C9D0DE" font-size="10" font-weight="600">30-day guarantee</text>
      <text x="410" y="694" fill="#5D677A" font-size="8.5">No questions asked</text>
    </g>
