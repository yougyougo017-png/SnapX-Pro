      <rect x="766" y="476" width="716" height="54" rx="12" fill="#080D16" stroke="#FFD700" stroke-opacity=".28"/>
      <rect x="766" y="476" width="716" height="54" rx="12" fill="#FFD700" fill-opacity=".02"/>
      <rect x="786" y="492" width="42" height="22" rx="4" fill="#1B2D56" stroke="#3E5A99" stroke-opacity=".5"/>
      <text x="807" y="507" text-anchor="middle" fill="#8EAEFF" font-family="Georgia, serif" font-size="11" font-style="italic">VISA</text>
      <text x="846" y="510" fill="#F0F3F9" font-family="Cascadia Code, Consolas, monospace" font-size="14" letter-spacing="1.5">4242 4242 4242 4242</text>
      <circle cx="1452" cy="503" r="6" stroke="#3BE3A0" stroke-width="1.2" fill="none"/>
      <path d="m1448 503 3 3 5-6" stroke="#3BE3A0" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <text x="766" y="564" fill="#8A94A8" font-weight="500">Expiry</text>
      <rect x="766" y="576" width="346" height="50" rx="12" fill="#080D16" stroke="#FFFFFF" stroke-opacity=".09"/>
      <text x="786" y="607" fill="#DCE2EE" font-family="Cascadia Code, Consolas, monospace" font-size="13">08 / 29</text>
      <text x="1136" y="564" fill="#8A94A8" font-weight="500">CVC</text>
      <rect x="1136" y="576" width="346" height="50" rx="12" fill="#080D16" stroke="#FFFFFF" stroke-opacity=".09"/>
      <text x="1156" y="607" fill="#DCE2EE" font-family="Cascadia Code, Consolas, monospace" font-size="13" letter-spacing="2">•••</text>
      <circle cx="1430" cy="600" r="7" stroke="#697387" stroke-width="1" fill="none"/>
      <text x="1430" y="603" text-anchor="middle" fill="#697387" font-size="7">?</text>

      <text x="766" y="662" fill="#8A94A8" font-weight="500">Name on card</text>
      <rect x="766" y="674" width="716" height="50" rx="12" fill="#080D16" stroke="#FFFFFF" stroke-opacity=".09"/>
      <text x="786" y="705" fill="#DCE2EE" font-size="12">Maya Chen</text>

      <rect x="766" y="752" width="716" height="58" rx="14" fill="url(#gold)"/>
      <text x="1124" y="786" text-anchor="middle" fill="#171100" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">Pay $149.00 securely</text>
      <rect x="1362" y="768" width="78" height="24" rx="7" fill="#171100" fill-opacity=".1"/>
      <text x="1401" y="784" text-anchor="middle" fill="#2A1D00" font-size="8" font-weight="700">SNAPX PAY</text>

      <text x="1124" y="834" text-anchor="middle" fill="#596275" font-size="9">By completing your purchase you agree to the Terms and Privacy Policy.</text>
