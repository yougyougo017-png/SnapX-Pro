      <rect x="766" y="378" width="716" height="50" rx="12" fill="#080D16" stroke="#FFFFFF" stroke-opacity=".09"/>
      <text x="786" y="409" fill="#DCE2EE" font-size="15" letter-spacing="3">••••••••••••</text>
