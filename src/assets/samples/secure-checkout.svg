  <g font-family="Segoe UI, sans-serif" opacity=".6">
    <circle cx="1518" cy="928" r="17" fill="#0B111C" stroke="#FFFFFF" stroke-opacity=".08"/>
    <path d="M1518 920v16M1510 928h16" stroke="#FFD700" stroke-width="1" stroke-linecap="round"/>
