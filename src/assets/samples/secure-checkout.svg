    <g>
      <rect x="72" y="96" width="34" height="34" rx="10" fill="url(#gold)"/>
      <path d="m81 120 8-16 8 16-8-5-8 5Z" fill="#171100"/>
      <text x="118" y="111" fill="#F7F8FB" font-family="Sora, Segoe UI, sans-serif" font-size="16" font-weight="700">SnapX</text>
      <text x="118" y="126" fill="#FFD700" font-size="8" letter-spacing="2.4">PRO</text>
    </g>
    <text x="72" y="196" fill="#6E788C" font-size="9" letter-spacing="2.4">YOUR ORDER</text>
    <text x="72" y="242" fill="#F8F9FC" font-family="Sora, Segoe UI, sans-serif" font-size="34" font-weight="600">Lifetime access.</text>
    <text x="72" y="274" fill="#7C869A" font-size="12.5">One payment. Every future update.</text>

    <rect x="72" y="306" width="590" height="312" rx="20" fill="url(#card)" stroke="#FFFFFF" stroke-opacity=".08"/>
    <rect x="98" y="332" width="80" height="80" rx="18" fill="linear" stroke="#FFD700" stroke-opacity=".25"/>
    <rect x="98" y="332" width="80" height="80" rx="18" fill="#FFD700" fill-opacity=".08"/>
    <path d="M126 358h24M138 346v24" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="138" cy="382" r="7" stroke="#FFD700" stroke-width="1.4" fill="none"/>
    <text x="196" y="356" fill="#F4F6FA" font-size="14" font-weight="600">SnapX Pro — Lifetime</text>
    <text x="196" y="376" fill="#6E788C" font-size="10.5">All features. All themes. Forever.</text>
    <text x="196" y="394" fill="#5A6478" font-size="9.5">License for 1 workspace</text>
    <text x="634" y="360" text-anchor="end" fill="#F8F9FC" font-family="Sora, Segoe UI, sans-serif" font-size="22" font-weight="600">$149</text>
    <path d="M98 436h538" stroke="#FFFFFF" stroke-opacity=".07"/>
    <g font-size="10.5">
      <circle cx="106" cy="464" r="4" fill="#3BE3A0"/>
