<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050810"/>
      <stop offset=".52" stop-color="#071021"/>
      <stop offset="1" stop-color="#04060c"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(1230 130) rotate(132) scale(760 600)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1756FF" stop-opacity=".25"/>
      <stop offset="1" stop-color="#1756FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(410 900) rotate(-40) scale(620 520)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD700" stop-opacity=".15"/>
      <stop offset="1" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF0A0"/>
      <stop offset=".45" stop-color="#FFD700"/>
      <stop offset="1" stop-color="#C9961F"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101726" stop-opacity=".95"/>
      <stop offset="1" stop-color="#080C15" stop-opacity=".98"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#225DFF"/>
      <stop offset="1" stop-color="#0A2C9E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="36" flood-color="#000" flood-opacity=".5"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="grain">
      <feTurbulence baseFrequency=".8" numOctaves="3" stitchTiles="stitch" type="fractalNoise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#FFFFFF" stroke-opacity=".025"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glowA)"/>
  <rect width="1600" height="1000" fill="url(#glowB)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <g filter="url(#shadow)">
    <rect x="26" y="20" width="1548" height="960" rx="24" fill="#070B13" stroke="#FFFFFF" stroke-opacity=".09"/>
  </g>

  <!-- browser chrome -->
  <path d="M26 44a24 24 0 0 1 24-24h1500a24 24 0 0 1 24 24v32H26V44Z" fill="#0A0E17"/>
  <circle cx="56" cy="47" r="5" fill="#FF6B7A"/>
  <circle cx="74" cy="47" r="5" fill="#FFC24B"/>
  <circle cx="92" cy="47" r="5" fill="#47D79F"/>
  <rect x="116" y="34" width="280" height="26" rx="8" fill="#050810" stroke="#FFFFFF" stroke-opacity=".05"/>
  <path d="M128 47h4M134 43v8" stroke="#6B7589" stroke-width="1" stroke-linecap="round"/>
  <text x="144" y="51" fill="#6D778D" font-family="Segoe UI, sans-serif" font-size="10.5">checkout.snapx.pro</text>
  <g opacity=".5">
    <path d="M1470 41h14M1477 34v14" stroke="#7E879A" stroke-width="1.2" stroke-linecap="round"/>
    <rect x="1496" y="38" width="12" height="10" rx="2" stroke="#7E879A" stroke-width="1.2"/>
  </g>
  <text x="1532" y="51" text-anchor="end" fill="#4E586B" font-family="Segoe UI, sans-serif" font-size="9">Secure checkout</text>

