<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2600" viewBox="0 0 1600 2600">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1600" y2="2600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6F0E4"/>
      <stop offset=".5" stop-color="#F2EBDD"/>
      <stop offset="1" stop-color="#EDE4D3"/>
    </linearGradient>
    <linearGradient id="heroSky" x1="0" y1="0" x2="0" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B8B3A1"/>
      <stop offset=".38" stop-color="#D9B18C"/>
      <stop offset=".7" stop-color="#C77C58"/>
      <stop offset="1" stop-color="#8B3A2A"/>
    </linearGradient>
    <linearGradient id="mountainFar" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#7D806F" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7D806F" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="mountainNear" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#3E4538"/>
      <stop offset="1" stop-color="#151C15"/>
    </linearGradient>
    <linearGradient id="autumn" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E8A33D"/>
      <stop offset="1" stop-color="#A93821"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5C6D50"/>
      <stop offset="1" stop-color="#263328"/>
    </linearGradient>
    <radialGradient id="sun" cx="0" cy="0" r="1" gradientTransform="translate(1230 250) scale(170)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFEBC6"/>
      <stop offset=".65" stop-color="#FFD9A6" stop-opacity=".4"/>
      <stop offset="1" stop-color="#FFD9A6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vermilion" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C74C32"/>
      <stop offset="1" stop-color="#7B1D13"/>
    </linearGradient>
    <linearGradient id="tea" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7D8B6A"/>
      <stop offset=".55" stop-color="#4E5B44"/>
      <stop offset="1" stop-color="#2A3126"/>
    </linearGradient>
    <linearGradient id="garden" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C7C1B1"/>
      <stop offset="1" stop-color="#8D887C"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence baseFrequency=".8" numOctaves="3" stitchTiles="stitch" type="fractalNoise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".06"/></feComponentTransfer>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
    <pattern id="waves" width="60" height="30" patternUnits="userSpaceOnUse">
      <path d="M0 22c10-12 20-12 30 0s20 12 30 0" fill="none" stroke="#2D2A22" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="2600" fill="url(#paper)"/>
  <rect width="1600" height="2600" fill="url(#waves)" opacity=".55"/>

  <!-- header -->
  <g font-family="Segoe UI, sans-serif">
    <text x="72" y="58" fill="#24211A" font-family="Georgia, serif" font-size="19" letter-spacing="4">MONO</text>
    <text x="72" y="74" fill="#8C8372" font-size="7" letter-spacing="3">A JOURNAL OF QUIET THINGS</text>
    <g fill="#5F5A4E" font-size="10" letter-spacing="1.4">
      <text x="636" y="59">PLACES</text>
      <text x="730" y="59">OBJECTS</text>
      <text x="824" y="59">PEOPLE</text>
      <text x="912" y="59">ARCHIVE</text>
    </g>
    <text x="1528" y="59" text-anchor="end" fill="#5F5A4E" font-size="10" letter-spacing="1.4">SUBSCRIBE</text>
    <path d="M72 96h1456" stroke="#24211A" stroke-opacity=".18"/>
  </g>

  <!-- hero -->
  <g>
    <rect x="0" y="96" width="1600" height="764" fill="url(#heroSky)"/>
    <circle cx="1230" cy="250" r="170" fill="url(#sun)"/>
    <circle cx="1230" cy="250" r="72" fill="#FFEAC6" opacity=".65"/>
    <path d="M0 680c190-120 340-66 500-142 174-82 278-164 440-146 162 18 300 118 440 168 90 32 154 36 220 20v280H0V680Z" fill="url(#mountainFar)"/>
    <path d="M0 762c182-122 310-112 476-190 174-82 302-138 436-92 150 52 258 168 400 212 106 32 200 20 288 4v196H0V762Z" fill="#5A5B4C" opacity=".45"/>
    <path d="M0 888c150-94 306-70 470-134 168-66 252-112 386-78 130 32 242 112 374 134 126 22 240 6 370-34v318H0V888Z" fill="url(#mountainNear)"/>
    <path d="M0 1054c188-86 336-68 510-118 158-46 252-68 386-40 146 30 260 92 398 102 100 8 206-8 306-44v330H0v-230Z" fill="#1D251C"/>
    <g fill="#0F160F">
      <path d="M151 906c8-66 46-116 58-182 2-10 14-10 16 0 12 66 50 116 58 182 2 14-20 24-66 24s-68-10-66-24Z"/>
      <path d="M330 1020c4-46 32-78 40-124 2-8 10-8 12 0 8 46 36 78 40 124 2 10-14 16-46 16s-48-6-46-16Z"/>
      <path d="M1350 1004c4-52 36-88 46-140 2-9 11-9 13 0 10 52 42 88 46 140 2 11-16 18-53 18s-54-7-53-18Z"/>
    </g>
    <g fill="#A44A29" opacity=".7">
      <circle cx="330" cy="700" r="80"/>
      <circle cx="450" cy="790" r="55"/>
      <circle cx="190" cy="860" r="42"/>
      <circle cx="1200" cy="800" r="60"/>
      <circle cx="1320" cy="870" r="36"/>
      <circle cx="1040" cy="740" r="44"/>
    </g>
    <g fill="#D79A3C" opacity=".45">
      <circle cx="388" cy="760" r="28"/>
      <circle cx="1108" cy="850" r="34"/>
      <circle cx="1250" cy="760" r="24"/>
    </g>
    <rect x="0" y="96" width="1600" height="764" fill="#000" opacity=".08"/>
    <rect x="0" y="96" width="1600" height="764" fill="url(#sun)" opacity=".16"/>

    <g font-family="Segoe UI, sans-serif">
      <text x="90" y="206" fill="#F7EDD9" font-size="9" letter-spacing="3.2">KYOTO, JAPAN · 35.0116° N</text>
      <text x="90" y="326" fill="#FFF9EA" font-family="Georgia, serif" font-size="82" letter-spacing="-2">Kyoto, in eleven</text>
      <text x="90" y="414" fill="#FFF9EA" font-family="Georgia, serif" font-size="82" letter-spacing="-2" font-style="italic">quiet moments.</text>
      <text x="94" y="466" fill="#EFE2CC" font-size="14">Notes on autumn light, moss gardens, and the art of doing less.</text>
      <g>
        <circle cx="100" cy="518" r="17" fill="#D6B98D" opacity=".8"/>
        <text x="126" y="514" fill="#F7EDD9" font-size="10" font-weight="600">Words by Aiko Mori</text>
        <text x="126" y="529" fill="#D6C8B2" font-size="8.5">Photography by Ren Ito · 12 min read</text>
      </g>
    </g>
    <text x="1510" y="746" text-anchor="end" fill="#F0E3CE" font-family="Segoe UI, sans-serif" font-size="8" letter-spacing="2">SCROLL SLOWLY ↓</text>
  </g>

  <!-- intro editorial -->
  <g font-family="Segoe UI, sans-serif">
    <text x="90" y="1012" fill="#8D6F49" font-size="9" letter-spacing="2.5">A NOTE FROM THE EDITOR</text>
    <text x="90" y="1084" fill="#25221A" font-family="Georgia, serif" font-size="40">The city reveals itself</text>
    <text x="90" y="1134" fill="#25221A" font-family="Georgia, serif" font-size="40" font-style="italic">when you stop looking.</text>
    <text x="90" y="1186" fill="#645E52" font-size="13" line-height="1.7">There is a particular hour in Kyoto, just after the temples close and before the lanterns</text>
    <text x="90" y="1208" fill="#645E52" font-size="13">come on, when the city seems to hold its breath. We spent nine days chasing it.</text>
    <g>
      <path d="M90 1252h58" stroke="#9B8B70"/>
      <text x="90" y="1274" fill="#8C8372" font-size="8.5" letter-spacing="1.6">VOLUME 07 · AUTUMN</text>
    </g>
    <g>
      <text x="930" y="1036" fill="#2A271F" font-family="Georgia, serif" font-size="56" font-style="italic">“</text>
      <text x="950" y="1070" fill="#39342A" font-family="Georgia, serif" font-size="22" font-style="italic">The maple does not hurry,</text>
      <text x="950" y="1102" fill="#39342A" font-family="Georgia, serif" font-size="22" font-style="italic">and yet nothing is late.</text>
      <text x="950" y="1148" fill="#8C8372" font-size="9" letter-spacing="1.8">A KYOTO PROVERB</text>
      <path d="M950 1172h64" stroke="#B8A98E"/>
    </g>
    <path d="M90 1322h1420" stroke="#24211A" stroke-opacity=".14"/>
  </g>

  <!-- three image columns -->
  <g>
    <g>
      <rect x="90" y="1370" width="436" height="430" fill="url(#green)"/>
      <path d="M90 1660c94-80 182-78 276-126 68-36 114-54 160-22v288H90v-140Z" fill="#1C261B" opacity=".7"/>
      <g fill="#A94B29" opacity=".75">
        <circle cx="194" cy="1512" r="46"/>
        <circle cx="260" cy="1568" r="28"/>
        <circle cx="152" cy="1590" r="20"/>
      </g>
      <path d="M300 1370c0 0 12 74-26 116" stroke="#2C1D12" stroke-width="3" fill="none"/>
      <rect x="90" y="1770" width="436" height="1" fill="#24211A" opacity=".15"/>
      <text x="90" y="1804" fill="#8D6F49" font-size="8.5" letter-spacing="2">01 · THE GARDEN</text>
      <text x="90" y="1838" fill="#25221A" font-family="Georgia, serif" font-size="27">Moss, after rain.</text>
      <text x="90" y="1868" fill="#6F685A" font-size="11">A small garden in Higashiyama that asks</text>
      <text x="90" y="1886" fill="#6F685A" font-size="11">nothing of you but your attention.</text>
    </g>
    <g>
      <rect x="582" y="1370" width="436" height="430" fill="#D8C8B0"/>
      <rect x="582" y="1370" width="436" height="430" fill="url(#vermilion)" opacity=".88"/>
      <path d="M680 1658h240M700 1580h200M720 1500h160" stroke="#3A1710" stroke-width="12" opacity=".45"/>
      <path d="M800 1370v430" stroke="#3A1710" stroke-width="20" opacity=".25"/>
      <g fill="#F4D9BC">
        <rect x="744" y="1460" width="14" height="198" rx="3"/>
        <rect x="842" y="1460" width="14" height="198" rx="3"/>
        <rect x="700" y="1460" width="200" height="14" rx="3"/>
        <rect x="716" y="1600" width="168" height="14" rx="3"/>
      </g>
      <rect x="582" y="1770" width="436" height="1" fill="#24211A" opacity=".15"/>
      <text x="582" y="1804" fill="#8D6F49" font-size="8.5" letter-spacing="2">02 · THE TEMPLE</text>
      <text x="582" y="1838" fill="#25221A" font-family="Georgia, serif" font-size="27">A gate, left open.</text>
      <text x="582" y="1868" fill="#6F685A" font-size="11">Fushimi Inari before the first train,</text>
      <text x="582" y="1886" fill="#6F685A" font-size="11">when the mountain belongs to no one.</text>
    </g>
    <g>
      <rect x="1074" y="1370" width="436" height="430" fill="url(#tea)"/>
      <ellipse cx="1292" cy="1580" rx="130" ry="84" fill="#1B2119"/>
      <ellipse cx="1292" cy="1560" rx="98" ry="56" fill="#9EA486"/>
      <ellipse cx="1292" cy="1558" rx="76" ry="40" fill="#697358"/>
      <path d="M1292 1520c-16 12-26 30-26 44" stroke="#D4D0B0" stroke-width="2" fill="none" opacity=".35"/>
      <g opacity=".4" stroke="#D4D0B0" fill="none">
        <path d="M1180 1500c-22 20-30 56-10 84"/>
        <path d="M1400 1510c18 16 24 50 8 72"/>
      </g>
      <rect x="1074" y="1770" width="436" height="1" fill="#24211A" opacity=".15"/>
      <text x="1074" y="1804" fill="#8D6F49" font-size="8.5" letter-spacing="2">03 · THE TEA</text>
      <text x="1074" y="1838" fill="#25221A" font-family="Georgia, serif" font-size="27">One bowl, two hands.</text>
      <text x="1074" y="1868" fill="#6F685A" font-size="11">In a wooden machiya, a lesson in</text>
      <text x="1074" y="1886" fill="#6F685A" font-size="11">receiving more than you asked for.</text>
    </g>
  </g>

  <!-- feature quote / wide image -->
  <g>
    <rect x="90" y="1960" width="1420" height="360" fill="url(#garden)"/>
    <rect x="90" y="1960" width="1420" height="360" fill="#7C776A" opacity=".25"/>
    <g fill="#E4DED0" opacity=".85">
      <ellipse cx="300" cy="2160" rx="120" ry="28"/>
      <ellipse cx="380" cy="2184" rx="80" ry="20"/>
      <ellipse cx="250" cy="2200" rx="52" ry="16"/>
      <ellipse cx="1150" cy="2120" rx="140" ry="32"/>
      <ellipse cx="1230" cy="2150" rx="92" ry="24"/>
    </g>
    <g fill="#555348">
      <ellipse cx="760" cy="2140" rx="150" ry="34"/>
      <ellipse cx="820" cy="2170" rx="100" ry="24"/>
      <ellipse cx="720" cy="2180" rx="60" ry="18"/>
    </g>
    <g stroke="#EFE8D7" stroke-width="2" fill="none" opacity=".22">
      <path d="M90 2080c160 22 280-22 420 0s260 30 420 4 380 10 580-18"/>
      <path d="M90 2260c180 18 300-16 460 6s260-8 420 8 360-12 540-4"/>
    </g>
    <g font-family="Segoe UI, sans-serif">
      <text x="130" y="2010" fill="#2E2A22" font-size="8.5" letter-spacing="2.2">THE ROCK GARDEN · RYOAN-JI</text>
      <text x="130" y="2300" fill="#312C23" font-family="Georgia, serif" font-size="36">Nothing here is accidental.</text>
      <text x="130" y="2330" fill="#4A4438" font-size="12">Fifteen stones. No one has ever seen them all at once.</text>
    </g>
  </g>

  <!-- lower editorial -->
  <g font-family="Segoe UI, sans-serif">
    <path d="M90 2388h1420" stroke="#24211A" stroke-opacity=".14"/>
    <text x="90" y="2432" fill="#8D6F49" font-size="9" letter-spacing="2.5">FIELD NOTES</text>
    <text x="90" y="2482" fill="#25221A" font-family="Georgia, serif" font-size="30" font-style="italic">Three things worth carrying home.</text>
    <g fill="#645E52" font-size="11">
      <text x="90" y="2524">01 — A hand-thrown cup, glazed the color of wet stone.</text>
      <text x="90" y="2546">02 — A folded packet of incense from the shop behind the temple.</text>
      <text x="90" y="2568">03 — The patience to let the day unfold without a plan.</text>
    </g>
    <g>
      <text x="1510" y="2460" text-anchor="end" fill="#8C8372" font-size="8" letter-spacing="1.8">NEXT STORY</text>
      <text x="1510" y="2490" text-anchor="end" fill="#25221A" font-family="Georgia, serif" font-size="21">The art of</text>
      <text x="1510" y="2514" text-anchor="end" fill="#25221A" font-family="Georgia, serif" font-size="21" font-style="italic">a slow morning.</text>
      <path d="M1430 2536h80M1496 2528l14 8-14 8" stroke="#A9833B" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <rect width="1600" height="2600" filter="url(#grain)" opacity=".5"/>
</svg>
