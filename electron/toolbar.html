<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'">
  <title>SnapX Toolbar</title>
  <link rel="stylesheet" href="toolbar.css">
</head>
<body>
  <div class="bar">
    <div class="brand" title="SnapX Pro — drag to move">
      <span class="logo">
        <svg viewBox="0 0 24 24" fill="none"><path d="M7 3h10a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4Z" stroke="currentColor" stroke-width="1.4"/><path d="m8.6 8.6 6.8 6.8m0-6.8-6.8 6.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </span>
      <div class="brand-text"><b>SnapX</b><span>PRO</span></div>
    </div>
    <span class="divider"></span>
    <div class="actions">
      <button class="action primary" data-action="region" title="Region capture">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.4"/></svg>
        <span>Region</span>
      </button>
      <button class="action" data-action="window" title="Window capture">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M3 9h18" stroke="currentColor" stroke-width="1.5"/><circle cx="6.2" cy="7" r=".7" fill="currentColor"/><circle cx="8.6" cy="7" r=".7" fill="currentColor"/></svg>
        <span>Window</span>
      </button>
      <button class="action" data-action="full" title="Full display capture">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="13" rx="2.2" stroke="currentColor" stroke-width="1.5"/><path d="M8 21h8M12 17v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span>Display</span>
      </button>
      <button class="action record" data-action="record" title="Record video">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="13" height="12" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="m16 10 4.2-2.2a.8.8 0 0 1 1.2.7v7a.8.8 0 0 1-1.2.7L16 14" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        <span>Record</span>
      </button>
      <button class="action" data-action="gif" title="Record GIF">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M8.5 14.5h-1a1.5 1.5 0 0 1-1.5-1.5v-2A1.5 1.5 0 0 1 7.5 9.5h1M8 12h1.2M12 14.5v-5h1.4a1.5 1.5 0 0 1 1.5 1.5v2a1.5 1.5 0 0 1-1.5 1.5H12ZM18 9.5h-2v5m0-2.7h1.6" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>GIF</span>
      </button>
    </div>
    <span class="divider"></span>
    <div class="utility">
      <button class="icon-btn" data-action="open" title="Open SnapX Pro">
        <svg viewBox="0 0 24 24" fill="none"><path d="M14 4h6v6M20 4l-8 8M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn close" data-action="close" title="Hide toolbar">
        <svg viewBox="0 0 24 24" fill="none"><path d="m7 7 10 10M17 7 7 17" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
  <script src="toolbar.js"></script>
</body>
</html>
