<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'">
  <title>SnapX Capture</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <img id="shot" alt="" draggable="false">
  <div id="shade"></div>
  <div id="selection" class="hidden">
    <span class="handle tl"></span>
    <span class="handle tr"></span>
    <span class="handle bl"></span>
    <span class="handle br"></span>
    <span id="dims" class="dims">0 × 0</span>
  </div>
  <svg id="lassoLayer" class="hidden" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <mask id="lassoMask">
        <rect x="0" y="0" width="100%" height="100%" fill="white"/>
        <path id="maskPath" d="" fill="black"/>
      </mask>
    </defs>
    <rect x="0" y="0" width="100%" height="100%" fill="rgba(3,5,11,.6)" mask="url(#lassoMask)"/>
    <path id="lassoPath" d="" fill="rgba(255,215,0,.045)" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="7 5"/>
  </svg>
  <div id="crosshair">
    <span class="line v"></span>
    <span class="line h"></span>
    <span id="crosshairLabel" class="coords">0, 0</span>
  </div>
  <div id="lens">
    <span class="lens-cross v"></span>
    <span class="lens-cross h"></span>
    <span class="lens-ring"></span>
  </div>
  <header class="hud">
    <div class="hud-brand">
      <span class="logo">
        <svg viewBox="0 0 24 24" fill="none"><path d="M7 3h10a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4Z" stroke="currentColor" stroke-width="1.5"/><path d="m8.5 8.5 7 7m0-7-7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </span>
      <div>
        <b id="modeTitle">Region capture</b>
        <span id="monitorLabel">Display</span>
      </div>
    </div>
    <div class="hud-hint"><kbd>ESC</kbd> to cancel <span></span><kbd>SHIFT</kbd> for square</div>
    <div class="rec-dot"><i></i> Live desktop</div>
  </header>
  <footer class="actions">
    <div class="hint">
      <span class="mouse">
        <svg viewBox="0 0 24 24" fill="none"><rect x="6" y="3" width="12" height="18" rx="6" stroke="currentColor" stroke-width="1.4"/><path d="M12 7v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </span>
      <span id="hintText">Drag anywhere to capture a region</span>
      <span class="hint-keys"><kbd>↵</kbd> confirm</span>
    </div>
    <div class="buttons">
      <button id="cancelBtn" class="btn ghost" type="button">Cancel</button>
      <button id="captureBtn" class="btn gold" type="button" disabled>
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1l1.2-2h6.6l1.2 2h1A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5v-8Z" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12.5" r="3.2" stroke="currentColor" stroke-width="1.5"/></svg>
        Capture
        <kbd>↵</kbd>
      </button>
    </div>
  </footer>
  <div id="toast" class="toast"></div>
  <script src="overlay.js"></script>
</body>
</html>
